{% extends "base.html" %}
{% block title %} — Edit Note{% endblock %}

{% block content %}
<div class="page fade-in">
  <div class="note-edit-wrap">
    <div class="flex-between mb16">
      <span class="sec-title">Edit Note</span>
      <a href="{% url 'tracker:notes' %}" style="font-size:12px;color:var(--tm);border:1px solid var(--b2);padding:5px 12px;border-radius:6px;text-decoration:none;">← Back to Notes</a>
    </div>
    <div class="card">
      <form method="post" action="{% url 'tracker:note_edit' note.id %}">
        {% csrf_token %}
        <input type="hidden" name="color" id="note-color-val" value="{{ note.color }}">

        <div style="display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;margin-bottom:16px;">
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-lbl">Title (optional)</label>
            <input class="form-input" type="text" name="title" value="{{ note.title }}" placeholder="Note title…" maxlength="200">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-lbl">Colour</label>
            <div class="color-dot-row">
              <div class="color-dot c-default {% if note.color == 'default' %}sel{% endif %}" data-c="default" onclick="setNoteColor(this)"></div>
              <div class="color-dot c-warm    {% if note.color == 'warm'    %}sel{% endif %}" data-c="warm"    onclick="setNoteColor(this)"></div>
              <div class="color-dot c-cool    {% if note.color == 'cool'    %}sel{% endif %}" data-c="cool"    onclick="setNoteColor(this)"></div>
              <div class="color-dot c-accent  {% if note.color == 'accent'  %}sel{% endif %}" data-c="accent"  onclick="setNoteColor(this)"></div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-lbl">Content</label>
          <textarea class="note-textarea" name="content" required>{{ note.content }}</textarea>
        </div>

        <div style="display:flex;gap:10px;">
          <button type="submit" class="btn-add" style="flex:1;">Save changes →</button>
          <a href="{% url 'tracker:notes' %}" style="padding:11px 20px;border:1px solid var(--b2);border-radius:10px;color:var(--tm);font-size:14px;text-decoration:none;">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
function setNoteColor(dot) {
  document.querySelectorAll(".color-dot").forEach(d => d.classList.remove("sel"));
  dot.classList.add("sel");
  document.getElementById("note-color-val").value = dot.dataset.c;
}
</script>
{% endblock %}
