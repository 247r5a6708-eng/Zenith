{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Nakama Streak</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-wrap fade-in">
  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-logo">🔑</div>
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-sub">Enter your email and we'll send a reset link</p>
    </div>

    {% if form.errors %}
    <div class="auth-err">{{ form.errors }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="auth-group">
        <label class="auth-lbl">Email address</label>
        <input class="auth-input" type="email" name="email"
               placeholder="your@email.com" autofocus required>
      </div>
      <button type="submit" class="auth-btn">Send reset link →</button>
    </form>

    <p class="auth-foot">
      <a href="{% url 'login' %}">← Back to sign in</a>
    </p>
  </div>
</div>
</body>
</html>
