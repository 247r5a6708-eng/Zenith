{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Your Email — Nakama Streak</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-wrap fade-in">
  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-logo">📬</div>
      <h1 class="auth-title">Check your email</h1>
      <p class="auth-sub">
        If an account exists with that email, we've sent a password reset link.<br><br>
        <strong style="color:var(--tm);font-size:12px;">
          Check your inbox (and spam folder) — it should arrive within a minute.
        </strong>
      </p>
    </div>
    <p class="auth-foot">
      <a href="{% url 'login' %}">← Back to sign in</a>
    </p>
  </div>
</div>
</body>
</html>
